name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

env:
  # WiX v7 introduced an Open Source Maintenance Fee EULA. v6 is still the
  # open-source (LGPL) release, so the installer stays buildable for everyone.
  WIX_VERSION: 6.0.2

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --check

      - name: Build
        run: cargo build --release

      - name: Test
        run: cargo test --release

      # Sign before packaging so the .msi embeds the signed executable.
      - name: Sign executable
        shell: pwsh
        run: ./installer/sign.ps1 -Path target\release\winpurge.exe

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: winpurge.exe
          path: target/release/winpurge.exe
          if-no-files-found: error

      - name: Build installer
        shell: pwsh
        working-directory: installer
        run: |
          dotnet tool install --global wix --version $env:WIX_VERSION
          Copy-Item ..\target\release\winpurge.exe .
          wix build winpurge.wxs -o ..\winpurge-ci.msi

      # Best effort: signtool can sign MSIs, the PowerShell fallback cannot.
      - name: Sign installer
        shell: pwsh
        run: ./installer/sign.ps1 -Path winpurge-ci.msi -Optional

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: winpurge.msi
          path: winpurge-ci.msi
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: winpurge.exe
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: winpurge.msi
          path: dist
      - name: Name the installer after the tag
        run: mv dist/winpurge-ci.msi "dist/winpurge-${{ github.ref_name }}.msi"
      - name: Attach binaries to the release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            **WinPurge** — see what is eating your Windows drive, and clean it
            without breaking Windows.

            - Space-usage treemap and tree views (drive, directory depth selectable)
            - Whitelist-only junk cleaning into a restorable quarantine
            - Browser crash reports, Sogou IME logs, Windows/browser caches, Windows.old

            Binaries are signed with a **self-signed** certificate: they prove the
            download was not tampered with, but Windows SmartScreen will still warn
            until the tool builds up reputation (or you sign with a purchased
            OV/EV certificate).

            Install with the `.msi`, or run the portable `.exe` directly.
          files: |
            dist/winpurge.exe
            dist/winpurge-${{ github.ref_name }}.msi
