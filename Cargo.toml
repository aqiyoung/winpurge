[package]
name = "winpurge"
version = "0.1.0"
edition = "2021"
description = "Safely analyze disk usage and clean junk files on Windows system drives"
license = "MIT"
publish = false

[[bin]]
name = "winpurge"
path = "src/main.rs"

[dependencies]
eframe = "0.37"
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
